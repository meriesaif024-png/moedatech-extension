<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Team Feedback Pins</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Feedback Pins</h1>
      <div class="actions">
        <button id="addNote">+ Add note</button>
      </div>
    </header>
    <div class="authorRow">
      <label for="authorName">Your name:</label>
      <input type="text" id="authorName" placeholder="e.g. Saif" />
    </div>
    <div id="status"></div>
    <ul id="noteList"></ul>
    <footer>
      <a id="viewAll" href="#">View all notes across the site</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
