<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Moedatech Detector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Moedatech Detector</h1>
      <div class="actions">
        <button id="addNote">+ Add note</button>
        <button id="quickNote">+ Quick note</button>
      </div>
    </header>
    <div class="meRow">
      <label for="myName">I am:</label>
      <input type="text" id="myName" placeholder="Your name" />
      <span id="meSaved"></span>
    </div>
    <div id="quickNoteForm" hidden></div>
    <div id="status"></div>
    <ul id="noteList"></ul>
    <footer>
      <a id="viewAll" href="#">View all notes across the site</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
