<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Site Problem Finder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Site Problem Finder</h1>
      <div class="actions">
        <button id="scanLinks">Scan links</button>
        <button id="clear">Clear</button>
      </div>
    </header>
    <div id="status"></div>
    <div id="dropZone">
      <span>Drag a screenshot here, or click to choose a file</span>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>
    <img id="preview" hidden />
    <ul id="issueList"></ul>
    <script src="popup.js"></script>
  </body>
</html>
